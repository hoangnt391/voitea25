name: Sync VoiTea now
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python .github/sync_patch.py
      - name: Verify and push
        run: |
          rm -f .github/sync_patch.py .github/workflows/apply-bar-stock-collapse.yml .github/workflows/sync-voitea-now.yml
          git config user.name openai-sync
          git config user.email openai-sync@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "sync: update VoiTea from deployed source"
          git push origin HEAD:main
