name: Export VoiTea Source

on:
  push:
    paths:
      - '.github/workflows/export-source-drive.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source ZIP
        shell: bash
        run: zip -r voitea25-source-2026-09-17.zip . -x '.git/*' 'node_modules/*' 'voitea25-source-2026-09-17.zip'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: voitea25-source-drive
          path: voitea25-source-2026-09-17.zip
          retention-days: 1
