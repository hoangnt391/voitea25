name: Export VoiTea source for Drive
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: github.event.head_commit.message == 'chore: export VoiTea source for Drive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r voitea25-source-2026-09-17.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'voitea25-source-2026-09-17.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: voitea25-source-drive
          path: voitea25-source-2026-09-17.zip
          retention-days: 1
