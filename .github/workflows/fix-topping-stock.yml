name: Apply topping stock hotfix

on:
  push:
    paths:
      - '.github/workflows/fix-topping-stock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch topping availability
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/index.ts')
          text = backend.read_text(encoding='utf-8')
          old_base = "Number(b.outputStock||0)>=Number(d.amount)"
          old_ing = "Number(i.stock||0)>=Number(d.amount)"
          assert old_base in text, 'base topping availability expression not found'
          assert old_ing in text, 'ingredient topping availability expression not found'
          text = text.replace(old_base, "Number(b.outputStock||0)>0")
          text = text.replace(old_ing, "Number(i.stock||0)>0")
          backend.write_text(text, encoding='utf-8')

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          needle = "},[]);const filtered=menu.filter"
          insert = "},[]);useEffect(()=>{const refreshAvailability=()=>{reloadMenu();reloadToppings()};window.addEventListener('focus',refreshAvailability);return()=>window.removeEventListener('focus',refreshAvailability)},[]);useEffect(()=>{if(['customer','pos','checkout'].includes(mode)){reloadMenu();reloadToppings()}},[mode]);const filtered=menu.filter"
          assert needle in text, 'frontend availability insertion point not found'
          text = text.replace(needle, insert, 1)
          app.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-topping-stock.yml').unlink()
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/index.ts src/App.tsx .github/workflows/fix-topping-stock.yml
          git commit -m "fix: allow toppings while stock remains"
          git push origin HEAD:main
