name: Export source ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source ZIP
        run: |
          zip -r voitea25-source.zip . -x '.git/*' -x 'voitea25-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: voitea25-source
          path: voitea25-source.zip
          retention-days: 1
